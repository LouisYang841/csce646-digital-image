name: Deploy to GitHub Pages

# 构建 Vite 多页应用（index / pr01 / pr02 / pr03）并发布到
# https://louisyang841.github.io/csce646-digital-image/
#
# 注意：本仓库的 Pages 发布源必须是「GitHub Actions」。
# 历史上它是从 main 分支直接发布的，那种模式下分支构建会覆盖 Actions 的产物，
# 所以保留了下面 "Ensure Pages source" 一步做自动纠正。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # 项目页部署在子路径下，资源前缀必须带仓库名，否则 JS/CSS 会 404
          BASE_PATH: /csce646-digital-image/

      - name: Ensure Pages source is GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"

          if curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "$API" | grep -q '"build_type": *"workflow"'; then
            echo "发布源已是 GitHub Actions，无需调整。"
            exit 0
          fi

          echo "发布源不是 GitHub Actions，尝试自动切换…"
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               -d '{"build_type":"workflow"}' "$API" \
            || echo "::warning::自动切换失败，请到 Settings → Pages → Build and deployment → Source 手动选择 “GitHub Actions”"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
