name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /csce646-digital-image/

      # 本仓库的 Pages 发布源当前是「从 main 分支发布」，
      # 这种模式下 actions/deploy-pages 无法工作，需要先把发布源切成 GitHub Actions。
      # 这里打印 API 的真实返回码，并用 ::warning:: 注解暴露出来（注解可公开读取，便于排错）。
      - name: Ensure Pages source is GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com/repos/${{ github.repository }}/pages
        run: |
          call() {
            local method="$1"; shift
            curl -sS -X "$method" "$API" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -w '\n__HTTP__%{http_code}' "$@"
          }
          one() { tr -d '\n' | tr -s ' ' | head -c 500; }

          GET_OUT=$(call GET); echo "GET /pages -> $GET_OUT"
          if echo "$GET_OUT" | grep -q '__HTTP__20'; then
            echo "::notice::GET /pages => $(echo "$GET_OUT" | one)"
          else
            echo "::warning::GET /pages => $(echo "$GET_OUT" | one)"
          fi

          if echo "$GET_OUT" | grep -q '"build_type": *"workflow"'; then
            echo "发布源已经是 GitHub Actions，跳过切换。"
            exit 0
          fi

          PUT_OUT=$(call PUT -d '{"build_type":"workflow"}'); echo "PUT /pages -> $PUT_OUT"
          if echo "$PUT_OUT" | grep -q '__HTTP__20'; then
            echo "::notice::PUT /pages OK => $(echo "$PUT_OUT" | one)"
          else
            echo "::error::PUT /pages 失败（需在 Settings → Pages → Source 手动选 GitHub Actions）=> $(echo "$PUT_OUT" | one)"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
